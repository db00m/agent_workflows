version: 2
steps:
  - id: inspect
    role: inspector
    model: gpt-5-codex
    automatic: true
    prompt: |
      Inspect the repository and determine whether the workflow structure looks valid.
    output:
      valid: boolean
      result: string

  - id: summarize
    role: summarizer
    prompt: |
      Summarize the inspection result for the user.
    additional_context:
      valid:
        $ref: steps.inspect.output.valid
      text:
        $ref: steps.inspect.output.result
    output:
      summary: string
